<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <title>GMAO terrain</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <a href="#/accueil" class="brand"><img src="icon.svg" alt="" width="26" height="26"> <span class="brand-txt">GMAO terrain</span></a>
    <button id="site" class="site hidden" data-act="site" type="button"></button>
    <span id="net" class="net"></span>
    <button id="sync" class="sync hidden" data-act="sync-ouvrir" type="button"></button>
    <button id="who" class="who" data-act="who" type="button"></button>
  </header>

  <nav class="tabs" aria-label="Navigation principale">
    <a href="#/accueil" data-tab="accueil"><span class="ic">⌂</span>Accueil</a>
    <a href="#/demandes" data-tab="demandes"><span class="ic">✎</span>Demandes</a>
    <a href="#/ots" data-tab="ots"><span class="ic">⚒</span>Travaux</a>
    <a href="#/parc" data-tab="parc"><span class="ic">▦</span>Parc</a>
    <a href="#/plus" data-tab="plus" class="only-mobile"><span class="ic">≡</span>Plus</a>
    <a href="#/preventif" data-tab="preventif" class="only-desktop"><span class="ic">↻</span>Préventif</a>
    <a href="#/magasin" data-tab="magasin" class="only-desktop"><span class="ic">▤</span>Magasin</a>
    <a href="#/indicateurs" data-tab="indicateurs" class="only-desktop"><span class="ic">▥</span>Indicateurs</a>
    <a href="#/journal" data-tab="journal" class="only-desktop"><span class="ic">☰</span>Journal</a>
    <a href="#/reglages" data-tab="reglages" class="only-desktop"><span class="ic">⚙</span>Réglages</a>
  </nav>

  <main id="view" tabindex="-1"><p class="muted pad">Chargement…</p></main>

  <a href="#/signaler" class="fab" id="fab">＋ Signaler</a>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/calculs.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/app.js"></script>
  <script src="js/vues/magasin.js"></script>
  <script src="js/vues/reappro.js"></script>
</body>
</html>
